---

- name: "Nginx | Create config"
  become: true
  ansible.builtin.template:
    src: "{{ zammad_nginx_config_template }}"
    dest: "{{ zammad_nginx_config_path }}"
    mode: "0644"
    owner: "root"
    group: "root"
  notify:
    - "Validate nginx config"
    - "Reload nginx"

...
