---
- name: "Prepare"
  hosts: "all"
  become: true
  tasks:
    - name: "Install necessary packages"
      when: "ansible_facts.os_family == 'Debian'"
      block:
        - name: "Install missing dependencies"
          ansible.builtin.apt:
            name:
              - "sudo"              # for `become` privilege escalation
              - "iproute2"          # for gathering network facts
              - "ca-certificates"   # for Gitlab-Runner download
              - "gpg"
              - "python3-debian"
            state: "present"
            update_cache: true

- name: "Install Docker for instances that need it"
  hosts: "all"
  become: true
  tasks:
    - name: "Include geerlingguy.docker role"
      when: "gitlab_runner_install_docker | default(false)"
      ansible.builtin.include_role:
        name: "geerlingguy.docker"
      vars:
        docker_install_compose: false
