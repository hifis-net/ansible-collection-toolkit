---
- name: "Verify"
  hosts: "all"
  tasks:
    - name: "Check that Zammad web interface is available"
      ansible.builtin.uri:
        url: "https://localhost"
        validate_certs: false
        return_content: true
      register: "zammad_web"
      failed_when: "'Zammad Helpdesk' not in zammad_web.content"

    - name: "Read the Nginx configuration"
      become: true
      ansible.builtin.slurp:
        src: "{{ zammad_nginx_config_path }}"
      register: "zammad_nginx_config"
      changed_when: false

    - name: "Check that client-controlled SSO identity headers are cleared"
      vars:
        zammad_nginx_config_content: "{{ zammad_nginx_config.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "zammad_nginx_config_content is search('proxy_set_header X-Forwarded-User \"\";')"
          - "zammad_nginx_config_content is search('proxy_set_header Remote-User \"\";')"
        fail_msg: "The Nginx configuration does not clear the client-controlled SSO identity headers."
        success_msg: "The Nginx configuration clears the client-controlled SSO identity headers."
      changed_when: false

    - name: "Render a custom Nginx template into a scratch file"
      vars:
        zammad_nginx_config_template: "custom-nginx.conf.j2"
        zammad_nginx_config_path: "/tmp/zammad-custom-nginx.conf"
      ansible.builtin.include_role:
        name: "hifis.toolkit.zammad"
        tasks_from: "nginx-config"

    - name: "Read the custom Nginx configuration"
      ansible.builtin.slurp:
        src: "/tmp/zammad-custom-nginx.conf"
      register: "zammad_custom_nginx_config"
      changed_when: false

    - name: "Check that the operator-provided Nginx template was used"
      vars:
        zammad_custom_nginx_config_content: "{{ zammad_custom_nginx_config.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "zammad_custom_nginx_config_content is search('This is a custom template')"
          - "zammad_custom_nginx_config_content is not search('upstream zammad-railsserver')"
        fail_msg: "The operator-provided Nginx template was not used."
        success_msg: "The operator-provided Nginx template was used."
      changed_when: false
